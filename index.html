<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C98A06">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pčelinjak">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Dnevnik pčelinjaka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#F4F3EC; --surface:#FFFFFF; --sunk:#EAE8DD; --ink:#1E261C; --muted:#5E6655; --line:#D8D6C8;
  --honey:#C98A06; --honey-soft:#FBEFD0; --honey-ink:#5A3D00; --leaf:#4E6E3D; --leaf-soft:#E3EBDA;
  --danger:#B23A2A; --danger-soft:#F7E1DC;
  --t-sirup:#C98A06; --t-pogaca:#9A6B2F; --t-varoa:#B23A2A; --t-pregled:#4E6E3D; --t-matica:#7A4E9A; --t-ramovi:#3F6F86; --t-med:#E0A615; --t-ostalo:#6D7264;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#141712; --surface:#1D211A; --sunk:#252A21; --ink:#ECEBDF; --muted:#A3A898; --line:#343A2E;
    --honey:#F0B532; --honey-soft:#3A2F12; --honey-ink:#FBE3A6; --leaf:#9BC285; --leaf-soft:#243020;
    --danger:#F08070; --danger-soft:#3A1F1A;
    --t-sirup:#F0B532; --t-pogaca:#D2A06A; --t-varoa:#F08070; --t-pregled:#9BC285; --t-matica:#C39AE0; --t-ramovi:#7FB6CF; --t-med:#F5CE5A; --t-ostalo:#A3A898;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#141712; --surface:#1D211A; --sunk:#252A21; --ink:#ECEBDF; --muted:#A3A898; --line:#343A2E;
  --honey:#F0B532; --honey-soft:#3A2F12; --honey-ink:#FBE3A6; --leaf:#9BC285; --leaf-soft:#243020;
  --danger:#F08070; --danger-soft:#3A1F1A;
  --t-sirup:#F0B532; --t-pogaca:#D2A06A; --t-varoa:#F08070; --t-pregled:#9BC285; --t-matica:#C39AE0; --t-ramovi:#7FB6CF; --t-med:#F5CE5A; --t-ostalo:#A3A898;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-bottom:120px;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:20px 14px}
header.top h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em;line-height:1.05}
header.top .sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.9rem;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--honey-soft);color:var(--honey-ink);border-radius:var(--r);padding:10px 14px;font-size:.9rem;margin-bottom:14px}
.banner button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--ink)}
.status{font-size:.8rem;color:var(--muted);margin-bottom:10px}

/* Hive grid */
.hives{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.hives{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hive{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:6px;min-height:128px}
.hive[aria-pressed="true"]{border-color:var(--honey);box-shadow:0 0 0 2px var(--honey) inset}
.hive .hname{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.1rem}
.hex{width:22px;height:25px;flex:none;background:var(--honey);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;color:var(--ground);font-family:var(--mono);font-size:.7rem}
.hive .last{font-size:.85rem;color:var(--muted)}
.hive .last b{color:var(--ink);font-weight:700}
.hive .warn{font-size:.8rem;color:var(--danger);font-weight:700}
.hive .tot{margin-top:auto;display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Filters */
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:26px;margin-bottom:10px}
.section-h h2{font-size:1.2rem;font-weight:800}
.section-h .count{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* Timeline */
.day{margin-top:18px}
.day-h{font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.entries{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;width:100%}
.entry:first-child{border-top:0}
.entry:hover{background:var(--sunk)}
.entry .tag{font-family:var(--mono);font-size:.75rem;background:var(--sunk);border-radius:6px;padding:3px 7px;white-space:nowrap}
.entry .what{display:flex;flex-direction:column;gap:2px;min-width:0}
.entry .what .t{display:flex;align-items:center;gap:7px;font-weight:700}
.entry .what .n{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.entry .qty{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.95rem;white-space:nowrap}
.primer{font-family:var(--mono);font-size:.68rem;color:var(--honey-ink);background:var(--honey-soft);border-radius:4px;padding:1px 5px;margin-left:4px;font-weight:500}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}

/* FAB */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--honey);color:#1E1500;border:0;border-radius:999px;padding:15px 26px;font-family:var(--display);font-weight:800;font-size:1.05rem;box-shadow:0 6px 20px rgba(60,40,0,.28);display:flex;align-items:center;gap:8px}
.fab svg{width:20px;height:20px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,8,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-radius:20px 20px 0 0;max-height:92%;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.2)}
@media (min-width:720px){.sheet{left:50%;right:auto;width:640px;transform:translateX(-50%)}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:1.3rem;font-weight:800;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > label,.field > .lbl{font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--ground);border-radius:10px;padding:9px 12px;font-size:.95rem;display:inline-flex;align-items:center;gap:7px}
.pick button[aria-pressed="true"]{background:var(--honey-soft);border-color:var(--honey);color:var(--honey-ink);font-weight:700}
.pick .all{font-size:.85rem;color:var(--muted)}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qtywrap{position:relative}
.qtywrap .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--mono);color:var(--muted);pointer-events:none}
.qtywrap input{padding-right:46px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{border-radius:12px;padding:13px 18px;font-weight:700;border:1px solid var(--line);background:var(--ground)}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink);flex:1}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.sure{background:var(--danger);color:var(--surface)}
.err{color:var(--danger);font-size:.9rem;margin-top:8px}
.hint{color:var(--muted);font-size:.85rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;z-index:20;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  @media (min-width:720px){.sheet{animation:none}}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Dnevnik pčelinjaka</h1>
      <div class="sub" id="sub">Prihrana, lečenje i pregledi po košnicama</div>
    </div>
    <button class="ghost" id="editHivesBtn" type="button">Podešavanja</button>
  </header>

  <div id="banner" class="banner" hidden>
    <span>Prikazani su primeri unosa da vidiš kako izgleda.</span>
    <button type="button" id="clearDemo">Obriši primere</button>
  </div>
  <div class="status" id="status" hidden></div>

  <div class="hives" id="hives"></div>

  <div class="section-h">
    <h2 id="logTitle">Svi unosi</h2>
    <span class="count" id="count"></span>
  </div>
  <div class="chips" id="typeChips"></div>
  <div id="log"></div>
</div>

<button class="fab" id="fab" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Novi unos
</button>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
const TYPES = {
  sirup:   {label:'Sirup',            color:'--t-sirup',  unit:'L',   qty:true,  detail:{label:'Odnos šećer : voda', options:['1:1','3:2','2:1']}},
  pogaca:  {label:'Pogača',           color:'--t-pogaca', unit:'kg',  qty:true},
  varoa:   {label:'Lek protiv varoe', color:'--t-varoa',  qty:false, detail:{label:'Preparat i doza', placeholder:'npr. Oksalna kiselina, 5 ml po ulici'}},
  pregled: {label:'Pregled',          color:'--t-pregled',qty:false, detail:{label:'Ramova sa pčelama', placeholder:'npr. 7'}},
  matica:  {label:'Matica',           color:'--t-matica', qty:false, detail:{label:'Šta je urađeno', options:['Viđena','Zamenjena','Nije nađena','Matičnjaci']}},
  ramovi:  {label:'Ramovi / nastavak',color:'--t-ramovi', unit:'kom', qty:true, detail:{label:'Šta', options:['Satne osnove','Izgrađeno saće','Nastavak dodat','Nastavak skinut']}},
  med:     {label:'Vrcanje meda',     color:'--t-med',    unit:'kg',  qty:true},
  ostalo:  {label:'Ostalo',           color:'--t-ostalo', qty:false}
};
const TYPE_KEYS = Object.keys(TYPES);
const DEFAULT_HIVES = [1,2,3,4,5,6].map(n=>({id:'k'+n, name:'Košnica '+n, order:n}));

const state = { hives:[], entries:[], hiveFilter:null, typeFilter:null, mode:'local' };
let db = null;
const $ = id => document.getElementById(id);

/* ---------- storage ---------- */
const LS_KEY = 'pcelinjak-v1';
function lsLoad(){ try{ const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({hives:state.hives, entries:state.entries})); }catch(e){} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

async function saveEntry(id, body){
  if(state.mode==='db'){
    const ref = id ? db.doc('entries/'+id) : db.collection('entries').doc();
    await ref.set(body);
  } else {
    if(id){ const i = state.entries.findIndex(e=>e.id===id); if(i>=0) state.entries[i] = {...body, id}; }
    else state.entries.push({...body, id:uid()});
    lsSave(); render();
  }
}
async function deleteEntry(id){
  if(state.mode==='db'){ await db.doc('entries/'+id).delete(); }
  else { state.entries = state.entries.filter(e=>e.id!==id); lsSave(); render(); }
}
async function saveHive(h){
  const body = {name:h.name, order:h.order};
  if(state.mode==='db'){ await db.doc('hives/'+h.id).set(body); }
  else { const i = state.hives.findIndex(x=>x.id===h.id); if(i>=0) state.hives[i] = {...h}; else state.hives.push({...h}); lsSave(); render(); }
}

/* ---------- dates ---------- */
function todayISO(){ const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function daysAgo(s){ const a = parseISO(s), b = parseISO(todayISO()); return Math.round((b-a)/86400000); }
function agoText(n){ if(n<=0) return 'danas'; if(n===1) return 'juče'; return 'pre '+n+' '+(n%10===1&&n%100!==11?'dan':'dana'); }
const MONTHS = ['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'];
const WDAYS = ['nedelja','ponedeljak','utorak','sreda','četvrtak','petak','subota'];
function dayLabel(s){ const d = parseISO(s); return d.getDate()+'. '+MONTHS[d.getMonth()]+' '+d.getFullYear(); }
function fmtNum(n){ return (Math.round(n*10)/10).toLocaleString('sr-Latn-RS'); }

/* ---------- render ---------- */
function hiveName(id){ const h = state.hives.find(x=>x.id===id); return h ? h.name : id; }
function hiveShort(id){ const h = state.hives.find(x=>x.id===id); if(!h) return '?'; const m = h.name.match(/\d+/); return m ? m[0] : h.name.slice(0,2); }
function sortedHives(){ return [...state.hives].sort((a,b)=>(a.order||0)-(b.order||0)); }
function sortedEntries(list){ return [...list].sort((a,b)=> a.date===b.date ? String(b.created||'').localeCompare(String(a.created||'')) : b.date.localeCompare(a.date)); }

function render(){
  const year = String(new Date().getFullYear());
  $('banner').hidden = !state.entries.some(e=>e.primer);

  // hives
  const hv = $('hives'); hv.textContent = '';
  for(const h of sortedHives()){
    const mine = sortedEntries(state.entries.filter(e=>e.hive===h.id));
    const feed = mine.find(e=>e.type==='sirup'||e.type==='pogaca');
    const treat = mine.find(e=>e.type==='varoa');
    const tot = {sirup:0,pogaca:0,med:0};
    for(const e of mine){ if(e.date.slice(0,4)===year && tot[e.type]!==undefined) tot[e.type] += Number(e.qty)||0; }
    const b = document.createElement('button');
    b.type='button'; b.className='hive'; b.setAttribute('aria-pressed', state.hiveFilter===h.id ? 'true':'false');
    const name = document.createElement('div'); name.className='hname';
    const hex = document.createElement('span'); hex.className='hex'; hex.textContent = hiveShort(h.id);
    const nm = document.createElement('span'); nm.textContent = h.name;
    name.append(hex, nm); b.append(name);
    const l1 = document.createElement('div'); l1.className='last';
    if(feed){ l1.innerHTML = 'Prihrana: <b></b> · '+agoText(daysAgo(feed.date)); l1.querySelector('b').textContent = TYPES[feed.type].label; }
    else l1.textContent = 'Prihrana: nema unosa';
    b.append(l1);
    const l2 = document.createElement('div'); l2.className='last';
    if(treat){ l2.innerHTML = 'Varoa: '+agoText(daysAgo(treat.date)); }
    else { l2.className='warn'; l2.textContent = 'Varoa: nije tretirana'; }
    b.append(l2);
    const t = document.createElement('div'); t.className='tot';
    t.innerHTML = '<span>Sirup '+fmtNum(tot.sirup)+' L</span><span>Pogača '+fmtNum(tot.pogaca)+' kg</span>'+(tot.med?'<span>Med '+fmtNum(tot.med)+' kg</span>':'');
    b.append(t);
    b.addEventListener('click', ()=>{ state.hiveFilter = state.hiveFilter===h.id ? null : h.id; render(); });
    hv.append(b);
  }
  $('sub').textContent = state.hives.length+' košnica · zbirovi za '+year+'.';

  // type chips
  const tc = $('typeChips'); tc.textContent = '';
  const mk = (key,label,color)=>{
    const c = document.createElement('button'); c.type='button'; c.className='chip';
    c.setAttribute('aria-pressed', state.typeFilter===key ? 'true':'false');
    if(color){ const d = document.createElement('span'); d.className='dot'; d.style.background = 'var('+color+')'; c.append(d); }
    c.append(document.createTextNode(label));
    c.addEventListener('click', ()=>{ state.typeFilter = key; render(); });
    tc.append(c);
  };
  mk(null,'Sve aktivnosti');
  for(const k of TYPE_KEYS) mk(k, TYPES[k].label, TYPES[k].color);

  // log
  let list = state.entries;
  if(state.hiveFilter) list = list.filter(e=>e.hive===state.hiveFilter);
  if(state.typeFilter) list = list.filter(e=>e.type===state.typeFilter);
  list = sortedEntries(list);
  $('logTitle').textContent = state.hiveFilter ? hiveName(state.hiveFilter) : 'Svi unosi';
  $('count').textContent = list.length + (list.length===1?' unos':' unosa');

  const log = $('log'); log.textContent = '';
  if(!list.length){
    const e = document.createElement('div'); e.className='empty';
    e.textContent = state.entries.length ? 'Nema unosa za izabrani filter.' : 'Još nema unosa. Dodaj prvi preko dugmeta „Novi unos”.';
    log.append(e); return;
  }
  const groups = new Map();
  for(const e of list){ if(!groups.has(e.date)) groups.set(e.date, []); groups.get(e.date).push(e); }
  for(const [date, items] of groups){
    const day = document.createElement('div'); day.className='day';
    const hd = document.createElement('div'); hd.className='day-h';
    const a = document.createElement('span'); a.textContent = dayLabel(date);
    const b = document.createElement('span'); b.textContent = WDAYS[parseISO(date).getDay()];
    hd.append(a,b); day.append(hd);
    const box = document.createElement('div'); box.className='entries';
    for(const e of items){
      const T = TYPES[e.type] || TYPES.ostalo;
      const row = document.createElement('button'); row.type='button'; row.className='entry';
      const tag = document.createElement('span'); tag.className='tag'; tag.textContent = 'K'+hiveShort(e.hive);
      tag.title = hiveName(e.hive);
      const what = document.createElement('span'); what.className='what';
      const t = document.createElement('span'); t.className='t';
      const d = document.createElement('span'); d.className='dot'; d.style.background='var('+T.color+')';
      t.append(d, document.createTextNode(T.label));
      if(e.primer){ const p = document.createElement('span'); p.className='primer'; p.textContent='primer'; t.append(p); }
      what.append(t);
      const bits = [e.detail, e.note].filter(Boolean);
      if(bits.length){ const n = document.createElement('span'); n.className='n'; n.textContent = bits.join(' — '); what.append(n); }
      const q = document.createElement('span'); q.className='qty';
      q.textContent = (e.qty!=null && e.qty!=='') ? fmtNum(Number(e.qty))+' '+(e.unit||T.unit||'') : '';
      row.append(tag, what, q);
      row.addEventListener('click', ()=>openEntry(e));
      box.append(row);
    }
    day.append(box); log.append(day);
  }
}

/* ---------- sheet ---------- */
let lastFocus = null;
function openSheet(build){
  lastFocus = document.activeElement;
  const s = $('sheet'); s.textContent=''; const g = document.createElement('div'); g.className='grab'; s.append(g);
  build(s); $('scrim').hidden = false; s.hidden = false;
  const f = s.querySelector('input,button:not(.grab)'); if(f) setTimeout(()=>f.focus({preventScroll:true}), 30);
}
function closeSheet(){ $('sheet').hidden = true; $('scrim').hidden = true; if(lastFocus) lastFocus.focus({preventScroll:true}); }
$('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('sheet').hidden) closeSheet(); });

function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>t.hidden=true, 2200); }
function downloadFile(name, text, type){
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function el(tag, props, ...kids){ const e = document.createElement(tag); if(props) for(const k in props){ if(k==='class') e.className=props[k]; else if(k==='text') e.textContent=props[k]; else e.setAttribute(k, props[k]); } for(const k of kids) if(k) e.append(k); return e; }

function openEntry(existing){
  const f = existing ? {...existing} : {date:todayISO(), type: state.typeFilter || 'sirup', qty:'', detail:'', note:''};
  let hivesSel = new Set(existing ? [existing.hive] : (state.hiveFilter ? [state.hiveFilter] : []));
  openSheet(s=>{
    s.append(el('h2',{id:'sheetTitle', text: existing ? 'Izmena unosa' : 'Novi unos'}));

    // hives
    const hf = el('div',{class:'field'}, el('span',{class:'lbl', text: existing ? 'Košnica' : 'Košnice'}));
    const hp = el('div',{class:'pick'});
    const drawHives = ()=>{
      hp.textContent='';
      for(const h of sortedHives()){
        const b = el('button',{type:'button','aria-pressed': hivesSel.has(h.id)?'true':'false'}, el('span',{class:'hex', text:hiveShort(h.id)}), document.createTextNode(h.name));
        b.addEventListener('click', ()=>{ if(existing){ hivesSel = new Set([h.id]); } else { hivesSel.has(h.id) ? hivesSel.delete(h.id) : hivesSel.add(h.id); } drawHives(); });
        hp.append(b);
      }
      if(!existing){
        const all = el('button',{type:'button', class:'all', text: hivesSel.size===state.hives.length ? 'Poništi sve' : 'Sve košnice'});
        all.addEventListener('click', ()=>{ hivesSel = hivesSel.size===state.hives.length ? new Set() : new Set(state.hives.map(h=>h.id)); drawHives(); });
        hp.append(all);
      }
    };
    drawHives(); hf.append(hp); s.append(hf);

    // type
    const tf = el('div',{class:'field'}, el('span',{class:'lbl', text:'Aktivnost'}));
    const tp = el('div',{class:'pick'});
    const dyn = el('div');
    const drawTypes = ()=>{
      tp.textContent='';
      for(const k of TYPE_KEYS){
        const d = el('span',{class:'dot'}); d.style.background='var('+TYPES[k].color+')';
        const b = el('button',{type:'button','aria-pressed': f.type===k?'true':'false'}, d, document.createTextNode(TYPES[k].label));
        b.addEventListener('click', ()=>{ if(f.type!==k){ f.type=k; f.detail=''; if(!TYPES[k].qty) f.qty=''; } drawTypes(); drawDyn(); });
        tp.append(b);
      }
    };
    const drawDyn = ()=>{
      dyn.textContent='';
      const T = TYPES[f.type];
      const row = el('div',{class:'row2'});
      const dateF = el('div',{class:'field'}, el('label',{for:'f-date', text:'Datum'}));
      const di = el('input',{type:'date', id:'f-date'}); di.value = f.date; di.addEventListener('input', ()=>f.date=di.value);
      dateF.append(di); row.append(dateF);
      if(T.qty){
        const qF = el('div',{class:'field'}, el('label',{for:'f-qty', text:'Količina'}));
        const qi = el('input',{type:'number', id:'f-qty', inputmode:'decimal', step:'0.1', min:'0', placeholder:'0'}); qi.value = f.qty ?? '';
        qi.addEventListener('input', ()=>f.qty=qi.value);
        qF.append(el('div',{class:'qtywrap'}, qi, el('span',{class:'u', text:T.unit}))); row.append(qF);
      }
      dyn.append(row);
      if(T.detail){
        const dF = el('div',{class:'field'}, el('span',{class:'lbl', text:T.detail.label}));
        if(T.detail.options){
          const p = el('div',{class:'pick'});
          const drawOpts = ()=>{ p.textContent=''; for(const o of T.detail.options){ const b = el('button',{type:'button','aria-pressed': f.detail===o?'true':'false', text:o}); b.addEventListener('click', ()=>{ f.detail = f.detail===o ? '' : o; drawOpts(); }); p.append(b);} };
          drawOpts(); dF.append(p);
        } else {
          const i = el('input',{type:'text', id:'f-detail', placeholder:T.detail.placeholder||''}); i.value = f.detail||''; i.addEventListener('input', ()=>f.detail=i.value);
          dF.append(i);
        }
        dyn.append(dF);
      }
      const nF = el('div',{class:'field'}, el('label',{for:'f-note', text:'Napomena'}));
      const ni = el('textarea',{id:'f-note', placeholder:'Stanje zajednice, vreme, zapažanja…'}); ni.value = f.note||''; ni.addEventListener('input', ()=>f.note=ni.value);
      nF.append(ni); dyn.append(nF);
    };
    drawTypes(); tf.append(tp); s.append(tf); s.append(dyn); drawDyn();

    const err = el('div',{class:'err'}); err.hidden = true;
    const actions = el('div',{class:'actions'});
    const save = el('button',{type:'button', class:'btn primary', text: existing ? 'Sačuvaj izmene' : 'Sačuvaj'});
    save.addEventListener('click', async ()=>{
      err.hidden = true;
      if(!hivesSel.size){ err.textContent='Izaberi bar jednu košnicu.'; err.hidden=false; return; }
      if(!f.date){ err.textContent='Unesi datum.'; err.hidden=false; return; }
      const T = TYPES[f.type];
      const qtyNum = T.qty && f.qty!=='' && f.qty!=null ? Number(String(f.qty).replace(',','.')) : null;
      if(T.qty && qtyNum!=null && !(qtyNum>=0)){ err.textContent='Količina mora biti broj.'; err.hidden=false; return; }
      save.disabled = true; save.textContent = 'Čuvam…';
      try{
        for(const hid of hivesSel){
          const body = {hive:hid, type:f.type, date:f.date, qty:qtyNum, unit:T.unit||null, detail:(f.detail||'').trim(), note:(f.note||'').trim(), created: existing?.created || new Date().toISOString()};
          await saveEntry(existing ? existing.id : null, body);
        }
        closeSheet();
        toast(existing ? 'Izmena sačuvana' : (hivesSel.size>1 ? 'Sačuvano za '+hivesSel.size+' košnica' : 'Unos sačuvan'));
      }catch(e){
        save.disabled=false; save.textContent = existing ? 'Sačuvaj izmene' : 'Sačuvaj';
        err.textContent = e && e.code==='quota_exceeded' ? 'Baza je puna. Obriši stare unose pa pokušaj ponovo.' : 'Čuvanje nije uspelo. Proveri vezu i pokušaj ponovo.';
        err.hidden=false;
      }
    });
    actions.append(save);
    if(existing){
      const del = el('button',{type:'button', class:'btn danger', text:'Obriši'});
      let armed = false;
      del.addEventListener('click', async ()=>{
        if(!armed){ armed = true; del.classList.add('sure'); del.textContent='Potvrdi brisanje'; return; }
        del.disabled = true;
        try{ await deleteEntry(existing.id); closeSheet(); toast('Unos obrisan'); }
        catch(e){ del.disabled=false; err.textContent='Brisanje nije uspelo. Pokušaj ponovo.'; err.hidden=false; }
      });
      actions.append(del);
    }
    s.append(actions, err);
  });
}

function openHives(){
  const draft = sortedHives().map(h=>({...h}));
  openSheet(s=>{
    s.append(el('h2',{id:'sheetTitle', text:'Košnice'}));
    s.append(el('p',{class:'hint', text:'Promeni nazive (npr. „Košnica 3 – LR”) ili dodaj novu košnicu.'}));
    const list = el('div');
    const draw = ()=>{
      list.textContent='';
      draft.forEach((h,i)=>{
        const f = el('div',{class:'field'});
        const inp = el('input',{type:'text', id:'hv-'+h.id, 'aria-label':'Naziv košnice '+(i+1)}); inp.value = h.name;
        inp.addEventListener('input', ()=>h.name = inp.value);
        f.append(inp); list.append(f);
      });
    };
    draw(); s.append(list);
    const add = el('button',{type:'button', class:'btn', text:'+ Dodaj košnicu'});
    add.addEventListener('click', ()=>{ const n = draft.length + 1; let id='k'+n; while(draft.some(h=>h.id===id)) id='k'+uid().slice(-4); draft.push({id, name:'Košnica '+n, order:n}); draw(); });
    const err = el('div',{class:'err'}); err.hidden = true;
    const save = el('button',{type:'button', class:'btn primary', text:'Sačuvaj'});
    save.addEventListener('click', async ()=>{
      save.disabled = true;
      try{
        for(const h of draft){
          const name = (h.name||'').trim() || 'Košnica';
          const old = state.hives.find(x=>x.id===h.id);
          if(!old || old.name!==name) await saveHive({...h, name});
        }
        closeSheet(); toast('Košnice sačuvane');
      }catch(e){ save.disabled=false; err.textContent='Čuvanje nije uspelo. Pokušaj ponovo.'; err.hidden=false; }
    });
    s.append(el('div',{class:'actions'}, add, save), err);

    // backup
    s.append(el('h2',{text:'Rezervna kopija', style:'margin-top:26px;margin-bottom:6px'}));
    s.append(el('p',{class:'hint', text:'Podaci su sačuvani samo na ovom telefonu. Povremeno napravi kopiju (npr. pošalji je sebi mejlom), pa ih možeš vratiti na novom telefonu ili posle brisanja pregledača.'}));
    const exp = el('button',{type:'button', class:'btn', text:'Sačuvaj kopiju (.json)'});
    exp.addEventListener('click', ()=>{
      const data = JSON.stringify({app:'pcelinjak', version:1, exported:new Date().toISOString(), hives:state.hives, entries:state.entries}, null, 2);
      downloadFile('pcelinjak-'+todayISO()+'.json', data, 'application/json');
    });
    const csv = el('button',{type:'button', class:'btn', text:'Izvoz za Excel (.csv)'});
    csv.addEventListener('click', ()=>{
      const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
      const rows = [['Datum','Košnica','Aktivnost','Količina','Jedinica','Detalj','Napomena'].map(q).join(';')];
      for(const e of sortedEntries(state.entries).reverse()){
        rows.push([e.date, hiveName(e.hive), (TYPES[e.type]||TYPES.ostalo).label, e.qty==null?'':String(e.qty).replace('.',','), e.unit||'', e.detail||'', e.note||''].map(q).join(';'));
      }
      downloadFile('pcelinjak-'+todayISO()+'.csv', '﻿'+rows.join('\r\n'), 'text/csv');
    });
    const fileIn = el('input',{type:'file', id:'importFile', accept:'.json,application/json'}); fileIn.hidden = true;
    const imp = el('button',{type:'button', class:'btn', text:'Vrati iz kopije'});
    const impMsg = el('div',{class:'hint'});
    imp.addEventListener('click', ()=>fileIn.click());
    fileIn.addEventListener('change', async ()=>{
      const file = fileIn.files && fileIn.files[0]; if(!file) return;
      try{
        const obj = JSON.parse(await file.text());
        if(!obj || !Array.isArray(obj.entries) || !Array.isArray(obj.hives)) throw new Error('format');
        const have = new Set(state.entries.map(e=>e.id));
        let added = 0;
        for(const e of obj.entries){ if(e && e.id && !have.has(e.id) && e.date && e.hive){ state.entries.push(e); added++; } }
        for(const h of obj.hives){ if(h && h.id && !state.hives.some(x=>x.id===h.id)) state.hives.push(h); }
        lsSave(); render(); closeSheet();
        toast(added ? 'Vraćeno unosa: '+added : 'Svi unosi iz kopije već postoje');
      }catch(e){ impMsg.textContent = 'Ovaj fajl nije kopija dnevnika pčelinjaka. Izaberi .json fajl koji je napravila ova aplikacija.'; }
      fileIn.value = '';
    });
    s.append(el('div',{class:'actions'}, exp, csv, imp), fileIn, impMsg);
  });
}

$('fab').addEventListener('click', ()=>openEntry(null));
$('editHivesBtn').addEventListener('click', openHives);
$('clearDemo').addEventListener('click', async ()=>{
  const demo = state.entries.filter(e=>e.primer);
  $('clearDemo').disabled = true;
  try{ for(const e of demo) await deleteEntry(e.id); toast('Primeri obrisani'); }
  catch(e){ toast('Brisanje nije uspelo'); }
  $('clearDemo').disabled = false;
});

/* ---------- boot ---------- */
function bootLocal(){
  const saved = lsLoad();
  state.mode = 'local';
  state.hives = saved && saved.hives && saved.hives.length ? saved.hives : DEFAULT_HIVES.map(h=>({...h}));
  state.entries = saved && saved.entries ? saved.entries : [];
  render();
}
bootLocal();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
})();
</script>
